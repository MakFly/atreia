services:
  atreia:
    build:
      context: .
      args:
        SITE_URL: "${SITE_URL:?Definir SITE_URL avec l'URL publique du site}"
    image: atreia:local
    ports:
      - "8787:8787"
    environment:
      LOG_LEVEL: info
      CORS_ORIGINS: ""
    read_only: true
    restart: unless-stopped
